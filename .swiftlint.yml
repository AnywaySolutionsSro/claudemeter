# SwiftLint (https://github.com/realm/SwiftLint) — CI runs `swiftlint --strict`,
# so every warning is a failure. Layout is SwiftFormat's job (see .swiftformat);
# this file covers naming, complexity/size limits and correctness rules.
included:
  - Sources
  - Widget
  - Tests
excluded:
  - .build
  - dist
  - DerivedData

disabled_rules:
  - trailing_comma        # SwiftFormat adds them (trailingCommas); don't fight it
  # Flags `String(decoding:as:)`, which is exactly what the compiler's
  # `String(cString:)` deprecation tells us to use; lossy decoding of transcript
  # lines and C buffers is deliberate here.
  - optional_data_string_conversion

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

# Apple's API Design Guidelines have no minimum identifier length; `p`, `u`, `n`
# in a 5-line test helper or a math closure are clearer than invented words.
identifier_name:
  min_length: 1
  max_length: 50
  validates_start_with_lowercase: error

# SwiftFormat (wrapMultilineStatementBraces) puts the `{` of a multi-line
# declaration on its own line; that's the one layout SwiftLint must accept.
opening_brace:
  allow_multiline_func: true

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

# Thresholds set just above the honest outliers in this codebase (SwiftUI view
# bodies, the auto-resume planner) so they act as a ceiling, not a backlog.
function_body_length:
  warning: 80
  error: 120
function_parameter_count:
  warning: 8
  error: 12
cyclomatic_complexity:
  warning: 12
  error: 20
file_length:
  warning: 500
  error: 800
type_body_length:
  warning: 300
  error: 400
