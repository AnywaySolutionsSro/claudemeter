# Signed, notarized, stapled ClaudeMeter.zip published to GitHub Releases —
# automatically, after every merge to main that changes the shipped app.
#
# The PR title (== the squash commit on main) decides the bump, see
# scripts/conventional.sh: feat -> minor, fix/perf -> patch, everything else
# (ci, docs, build, chore, ...) merges without a release. Majors are manual:
# Actions -> release -> Run workflow -> bump: major. `rebuild_tag` rebuilds the
# assets of an existing release instead. Versioning policy, ruleset setup and the
# secrets this needs are documented in docs/release.md.
#
# The build itself is `./build.sh --notarize`, unchanged from a local release;
# this workflow only provides what it expects: a keychain holding the Developer
# ID certificate and a notarytool profile named ClaudeMeterNotary. The tag is
# created together with the release, only after a green, verified build — a
# failed run leaves nothing behind.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # No default on purpose: "Run workflow" pre-filled with `major` published
      # an irrevocable v02.00.00 to anyone re-running the workflow after a failed
      # run. A rebuild or a re-run should pick `patch` (or set rebuild_tag).
      bump:
        description: "Manual release bump (major is only available here)"
        type: choice
        required: true
        options: [patch, minor, major]
      rebuild_tag:
        description: "Rebuild the assets of an existing release instead (vMM.mm.pp); ignores bump"
        required: false
        type: string

# Read by default; only the job that publishes gets a write token.
permissions:
  contents: read

# Runs queue behind each other so version numbers stay monotonic. A queued run
# that gets superseded is harmless: the plan folds every commit since the last
# release, so the surviving run releases once with the highest bump.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CODESIGN_ID: "Developer ID Application: Jakub Zak (72K9YQF24J)"
  NOTARY_PROFILE: ClaudeMeterNotary

jobs:
  plan:
    name: plan
    # Releases come from main only — a manual run from any other branch would
    # tag and publish that branch's build as the next version.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || '' }}
          REBUILD_TAG: ${{ inputs.rebuild_tag }}
        run: |
          set -euo pipefail
          if [ -n "$REBUILD_TAG" ]; then
            if ! [[ "$REBUILD_TAG" =~ ^v[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              echo "::error::rebuild_tag '$REBUILD_TAG' must look like vMM.mm.pp."
              exit 1
            fi
            if ! gh release view "$REBUILD_TAG" >/dev/null 2>&1; then
              echo "::error::Release '$REBUILD_TAG' does not exist in $GH_REPO."
              exit 1
            fi
            {
              echo "tag=$REBUILD_TAG"
              echo "version=${REBUILD_TAG#v}"
              echo "previous="
              echo "rebuild=true"
            } >> "$GITHUB_OUTPUT"
            echo "Rebuilding the assets of $REBUILD_TAG"
            exit 0
          fi

          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName -q '.[0].tagName // empty')"
          scripts/release-plan.sh "$previous" "$MANUAL_BUMP" | tee -a "$GITHUB_OUTPUT"
          echo "rebuild=false" >> "$GITHUB_OUTPUT"

  release:
    name: release
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: macos-26
    permissions:
      contents: write
    # notarytool --wait occasionally stalls; don't hold the runner (and the
    # release concurrency slot) for GitHub's 6-hour default.
    timeout-minutes: 45
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      REBUILD: ${{ needs.plan.outputs.rebuild }}
    steps:
      - name: Check release secrets are populated
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            value="${!name}"
            if [ -z "$value" ] || [ "$value" = "PLACEHOLDER" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::These repository secrets still hold the placeholder: ${missing[*]}. How to obtain each value: docs/release.md → 'Releases via GitHub Actions'."
            exit 1
          fi
          echo "All release secrets populated."

      # A rebuild checks out the released tag; a new release builds the commit
      # that triggered the run (the tag is created at that same sha below).
      # Full history: the release notes walk the commits since the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.rebuild == 'true' && needs.plan.outputs.tag || github.sha }}
          fetch-depth: 0

      - name: Select newest Xcode 26
        run: |
          set -euo pipefail
          xcode="$(for d in /Applications/Xcode_26*.app; do echo "$d"; done | sort -V | tail -1)"
          if [ ! -d "$xcode" ]; then
            echo "::error::No Xcode_26*.app on this runner image — the package needs the macOS 26 SDK."
            find /Applications -maxdepth 1 -name 'Xcode*' || true
            exit 1
          fi
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          cert="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$cert"
          # -T (not -A): only codesign and security may use the private key. -A
          # would let every process on the runner — including whatever brew just
          # installed — sign with or export the Developer ID key.
          security import "$cert" -P "$MACOS_CERT_PASSWORD" -t cert -f pkcs12 -k "$keychain" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          # Let codesign/notarytool use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$CODESIGN_ID"; then
            echo "::error::MACOS_CERT_P12 does not contain '$CODESIGN_ID'. Export the Developer ID Application certificate WITH its private key from Keychain Access (see docs/release.md)."
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi

      - name: Store notarytool credentials (App Store Connect API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$key"

      - name: Build, sign, notarize, staple
        env:
          BUILD_UNSIGNED: "1"
          MARKETING_VERSION: ${{ needs.plan.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          NOTARY_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
        run: ./build.sh --notarize

      - name: Verify the artifact
        run: |
          set -euo pipefail
          app=dist/ClaudeMeter.app
          codesign --verify --deep --strict --verbose=2 "$app"
          assessment="$(spctl -a -vvv -t install "$app" 2>&1 || true)"
          echo "$assessment"
          if ! grep -q "source=Notarized Developer ID" <<<"$assessment"; then
            echo "::error::spctl did not accept the app as Notarized Developer ID (see output above)."
            exit 1
          fi
          xcrun stapler validate "$app"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [ "$built" = "$VERSION" ] || { echo "::error::Built version '$built' != planned version '$VERSION'"; exit 1; }
          (cd dist && shasum -a 256 -c ClaudeMeter.zip.sha256)
          ls -la dist/ClaudeMeter.zip dist/ClaudeMeter.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(dist/ClaudeMeter.zip dist/ClaudeMeter.zip.sha256)
          if [ "$REBUILD" = "true" ]; then
            echo "Release $TAG exists — replacing assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists; the plan step should have moved past it. Use rebuild_tag to replace its assets."
              exit 1
            fi
            # Customer-facing notes from the merged PRs' "Release notes" sections
            # (see CLAUDE.md); the app shows these in its update prompt.
            scripts/release-notes.sh "$PREVIOUS" "$TAG" "$GH_REPO" > "$RUNNER_TEMP/notes.md"
            echo "--- release notes ---"; cat "$RUNNER_TEMP/notes.md"; echo "---------------------"
            # Creates the tag at the built commit as a side effect.
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "ClaudeMeter $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --json url -q '"Published: \(.url)"'

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
