# Signed, notarized, stapled ClaudeMeter.zip published to GitHub Releases.
#
# Trigger: push a tag `vMM.mm.pp` (e.g. v01.00.00) on a main commit — the tag
# ruleset lets only repository admins create them. `-rcN` suffixed tags publish
# a pre-release (use one to rehearse the pipeline). Versioning policy and the
# secrets this needs are documented in docs/release.md.
#
# The build itself is `./build.sh --notarize`, unchanged from a local release;
# this workflow only provides what it expects: a keychain holding the Developer
# ID certificate and a notarytool profile named ClaudeMeterNotary.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (vMM.mm.pp or vMM.mm.pp-rcN)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CODESIGN_ID: "Developer ID Application: Jakub Zak (72K9YQF24J)"
  NOTARY_PROFILE: ClaudeMeterNotary

jobs:
  release:
    name: release
    runs-on: macos-26
    # notarytool --wait occasionally stalls; don't hold the runner (and this
    # tag's concurrency slot) for GitHub's 6-hour default.
    timeout-minutes: 45
    steps:
      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REBUILD: ${{ github.event_name == 'workflow_dispatch' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]{2}\.[0-9]{2}\.[0-9]{2})(-rc[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vMM.mm.pp or vMM.mm.pp-rcN (e.g. v01.00.00). See docs/release.md."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          prerelease="false"; [ -n "${BASH_REMATCH[2]}" ] && prerelease="true"

          if [ "$REBUILD" = "true" ] && ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist in $GH_REPO."
            exit 1
          fi

          # Releases must move forward: the numeric part of the tag must be newer
          # than the latest published (non-draft, non-prerelease) release. Compared
          # without any -rcN suffix, because `sort -V` ranks v01.02.00-rc1 ABOVE
          # v01.02.00 — an rc for an already-shipped version must still be refused.
          latest="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName -q '.[0].tagName // empty')"
          if [ -n "$latest" ] && [ "$REBUILD" != "true" ]; then
            latest_base="${latest%%-rc*}"
            newest="$(printf '%s\n%s\n' "$latest_base" "v$version" | sort -V | tail -1)"
            if [ "$newest" != "v$version" ] || [ "$latest_base" = "v$version" ]; then
              echo "::error::Tag '$TAG' is not newer than the latest release '$latest'."
              exit 1
            fi
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $version, prerelease=$prerelease, previous=${latest:-none})"

      - name: Check release secrets are populated
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            value="${!name}"
            if [ -z "$value" ] || [ "$value" = "PLACEHOLDER" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::These repository secrets still hold the placeholder: ${missing[*]}. How to obtain each value: docs/release.md → 'Releases via GitHub Actions'."
            exit 1
          fi
          echo "All release secrets populated."

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Select newest Xcode 26
        run: |
          set -euo pipefail
          xcode="$(for d in /Applications/Xcode_26*.app; do echo "$d"; done | sort -V | tail -1)"
          if [ ! -d "$xcode" ]; then
            echo "::error::No Xcode_26*.app on this runner image — the package needs the macOS 26 SDK."
            find /Applications -maxdepth 1 -name 'Xcode*' || true
            exit 1
          fi
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          cert="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$cert"
          security import "$cert" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$cert"
          # Let codesign/notarytool use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$CODESIGN_ID"; then
            echo "::error::MACOS_CERT_P12 does not contain '$CODESIGN_ID'. Export the Developer ID Application certificate WITH its private key from Keychain Access (see docs/release.md)."
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi

      - name: Store notarytool credentials (App Store Connect API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$key"

      - name: Build, sign, notarize, staple
        env:
          BUILD_UNSIGNED: "1"
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          NOTARY_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
        run: ./build.sh --notarize

      - name: Verify the artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=dist/ClaudeMeter.app
          codesign --verify --deep --strict --verbose=2 "$app"
          assessment="$(spctl -a -vvv -t install "$app" 2>&1 || true)"
          echo "$assessment"
          if ! grep -q "source=Notarized Developer ID" <<<"$assessment"; then
            echo "::error::spctl did not accept the app as Notarized Developer ID (see output above)."
            exit 1
          fi
          xcrun stapler validate "$app"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [ "$built" = "$VERSION" ] || { echo "::error::Built version '$built' != tag version '$VERSION'"; exit 1; }
          (cd dist && shasum -a 256 -c ClaudeMeter.zip.sha256)
          ls -la dist/ClaudeMeter.zip dist/ClaudeMeter.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(dist/ClaudeMeter.zip dist/ClaudeMeter.zip.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            flags=(--title "ClaudeMeter $VERSION" --generate-notes --verify-tag)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG" "${assets[@]}" "${flags[@]}"
          fi
          gh release view "$TAG" --json url -q '"Published: \(.url)"'

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
