# Quality gates for every PR and for main. The five jobs are the required status
# checks in the "main: tests" ruleset (no bypass): pr-title, tests, lint,
# build-app, scripts.
#
#   pr-title   the PR title is a Conventional Commits subject with an allowed
#              type (scripts/check-pr-title.sh) — it becomes the squash commit on
#              main and decides the release bump (release.yml); pull_request only
#   tests      swift build/test with warnings-as-errors + ClaudeMeterCore
#              line coverage >= 80% (scripts/coverage-gate.sh)
#   lint       swiftlint --strict and swiftformat --lint (.swiftlint.yml, .swiftformat)
#   build-app  the real app + widget via XcodeGen/xcodebuild, unsigned,
#              warnings-as-errors — `swift build` never compiles the widget
#   scripts    shellcheck for build.sh + scripts/, actionlint for workflows
#
# The package targets macOS 26 / swift-tools 6.2 => macos-26 runner (Xcode 26).
name: ci

# `edited` is included so a title change re-runs pr-title: the title decides the
# release bump, and without it a PR opened as `docs:` and renamed to `feat:` in
# the UI would keep its green check and release without notes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the PR title (Conventional Commits, no breaking markers)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          scripts/check-pr-title.sh "$PR_TITLE" "$RUNNER_TEMP/pr-body.txt"

  tests:
    name: tests
    # A title edit changes nothing the heavy jobs look at.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest Xcode 26
        run: |
          set -euo pipefail
          xcode="$(for d in /Applications/Xcode_26*.app; do echo "$d"; done | sort -V | tail -1)"
          [ -d "$xcode" ] || { echo "::error::No Xcode_26*.app on this runner image"; exit 1; }
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test with coverage gate
        env:
          SWIFT_TEST_FLAGS: -Xswiftc -warnings-as-errors
          COVERAGE_THRESHOLD: "80"
        run: scripts/coverage-gate.sh

  lint:
    name: lint
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: swiftlint --strict
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: swiftformat --lint
        run: swiftformat . --lint

  build-app:
    name: build-app
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest Xcode 26
        run: |
          set -euo pipefail
          xcode="$(for d in /Applications/Xcode_26*.app; do echo "$d"; done | sort -V | tail -1)"
          [ -d "$xcode" ] || { echo "::error::No Xcode_26*.app on this runner image"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app + widget (unsigned, warnings are errors)
        env:
          BUILD_UNSIGNED: "1"
          WARNINGS_AS_ERRORS: "1"
        run: ./build.sh

      - name: Check the bundle
        run: |
          set -euo pipefail
          test -d dist/ClaudeMeter.app/Contents/PlugIns/ClaudeMeterWidget.appex
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/ClaudeMeter.app/Contents/Info.plist

  scripts:
    name: scripts
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck --version && shellcheck build.sh scripts/*.sh

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # From actionlint_<version>_checksums.txt on the release; bump together.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint -color
